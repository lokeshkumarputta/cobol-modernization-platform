name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-update-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit + integration tests (Testcontainers) with JaCoCo 80% gate
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            customer-update-service/target/surefire-reports
            customer-update-service/target/failsafe-reports
            customer-update-service/target/site/jacoco
      - name: Build container image
        run: docker build -t customer-update-service:${{ github.sha }} .
