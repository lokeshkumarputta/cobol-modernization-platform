apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: customer-update-service
  namespace: customer
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: customer-update-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
